# @package _global_
# faithful FlatVI reproduction: small batch, long training, tiny cell subset
# matches paper: batch_size=32, lr=1e-3, 1000 epochs, latent_dim=10, lambda=0.1

defaults:
  - override /data: sciplex
  - override /splitter: strict_k562
  - override /space: log1p_deg
  - override /condition: sciplex
  - override /task: ae
  - override /model: ae
  - override /loss: ae
  - override /ae_geometry: none
  - override /ae_schedule: single_phase

experiment_name: sciplex_ae_deg_log1p_nb_pullback_faithful

model:
  family: negative_binomial
  latent_dim: 10
  hidden_dim: 256
  decoder:
    dispersion_head: shared_gene

task:
  epochs: 1000
  batch_size: 32
  lr: 0.001

loss:
  weights:
    recon: 1.0
    pullback: 0.1

space:
  ae_export_artifact_tag: sciplex_ae_deg_log1p_nb_pullback_faithful
