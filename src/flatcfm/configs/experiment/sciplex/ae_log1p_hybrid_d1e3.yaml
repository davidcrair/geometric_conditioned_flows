# @package _global_
# hybrid ae (single phase) NB recon + PHATE distance loss with a small
# distance weight of 1e-3 for the thesis benchmark across k562 a549 mcf7

defaults:
  - override /data: sciplex
  - override /splitter: strict_k562
  - override /space: log1p_deg
  - override /condition: sciplex
  - override /task: ae
  - override /model: ae
  - override /loss: ae
  - override /ae_geometry: phate_potential
  - override /ae_schedule: single_phase

experiment_name: sciplex_ae_deg_log1p_hybrid_d1e3

task:
  epochs: 100

space:
  ae_export_artifact_tag: sciplex_ae_deg_log1p_hybrid_d1e3

loss:
  weights:
    recon: 1.0
    distance: 0.001
    pullback: 0.0
  distance_zeta: 20.0
  distance_alpha_min: 1000.0
