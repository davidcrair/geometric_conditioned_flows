# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe

hpo:
  enabled: true
  objective:
    name: val_loss
    mode: min
    source: best

hydra:
  mode: MULTIRUN
  sweep:
    dir: ${paths.run_dir}/sweeps/${experiment_name}/${now:%Y%m%d_%H%M%S}_${oc.env:SLURM_JOB_ID,local}
    subdir: ${hydra.job.num}
  sweeper:
    direction: minimize
    study_name: ${experiment_name}
    storage: null
    n_trials: 25
    n_jobs: 1
    sampler:
      n_startup_trials: 10
      multivariate: true
    params: {}
    custom_search_space: null
