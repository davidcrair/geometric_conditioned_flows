seed: 42
test_cell_type: K562
holdout_fraction: 0.5
subsample_seed: 0
subsample_n_cells: 100000
split_policy: underrepresented_context
ae_subsample_seed: 42
ae_subsample_n_cells: 50000
ae_subsample_group_cols:
  - cell_type
  - vehicle
val_fraction: 0.1
# union every vehicle=1 cell in sciplex3 into the canonical subsample and
# keep the full control pool in the train val and held_out splits instead
# of partitioning controls between them
include_all_controls: true
