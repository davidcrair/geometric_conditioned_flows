model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${hydra:runtime.output_dir}/checkpoints
  filename: best
  monitor: val_loss
  mode: min
  save_top_k: 1
  save_last: true
  auto_insert_metric_name: false

epoch_progress:
  _target_: flatcfm.modelcore.callbacks.EpochProgressBar
